spring.application.name=notification-service
server.port=8086

# Eureka Client Configuration
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Database Configuration (notification_service db on localhost:5436)
spring.datasource.url=jdbc:postgresql://localhost:5436/notification_service
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.cloud.compatibility-verifier.enabled=false

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=password

# OpenTelemetry Configuration
otel.service.name=notification-service
otel.service.version=1.0.0
otel.exporter.otlp.endpoint=http://localhost:4317
otel.exporter.otlp.protocol=grpc
otel.resource.attributes[service.name]=notification-service
otel.resource.attributes[service.version]=1.0.0
otel.resource.attributes[deployment.environment]=local
otel.traces.sampler=parentbased_always_on
otel.metrics.exporter=otlp
otel.logs.exporter=otlp

# Management endpoints for observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
