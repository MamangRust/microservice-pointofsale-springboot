spring.application.name=stats-backfill
server.port=0

# OLTP PostgreSQL source (pos_order / pos_transaction schemas)
spring.datasource.url=jdbc:postgresql://order-db:5432/order_service
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Kafka
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Backfill window
backfill.from=2020-01-01

# Disable web server — one-shot job
spring.main.web-application-type=none